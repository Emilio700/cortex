services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cortex_postgres
    environment:
      POSTGRES_USER: cortex_user
      POSTGRES_PASSWORD: cortex_password
      POSTGRES_DB: cortex_db
    ports:
      - "5442:5432"
    volumes:
      - cortex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex_user -d cortex_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortex_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: cortex_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://cortex_user:cortex_password@postgres:5432/cortex_db
      SECRET_KEY: dev-secret-key-change-in-production-12345678901234567890
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:5173,http://localhost:3010
      FRONTEND_URL: http://localhost:3010
      ENVIRONMENT: development
      APP_NAME: CORTEX
      # SMTP credentials come from the untracked .env file — never hardcode the
      # Gmail App Password here, this file is committed. See .env.example.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@cortex.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CORTEX}
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cortex_network

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: cortex_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8010
    ports:
      - "3010:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - cortex_network

  # pgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cortex_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cortex.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-local-only}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5060:80"
    volumes:
      - cortex_pgadmin_data:/var/lib/pgadmin
    networks:
      - cortex_network
    profiles:
      - tools

  # ── base-modulos-extra: servicios auxiliares en perfiles ──
  # No arrancan con `docker compose up -d postgres` ni con un `up` sin perfil.
  # Imagen: docker compose --profile imagen up -d
  # IA:     docker compose --profile ia up -d
  # Las versiones van fijas: una actualización se decide, no llega sola.

  # PACS: recibe por C-STORE lo que mandan los equipos (AET CORTEX, puerto 4242)
  # y lo expone por DICOMweb. Autenticación siempre activa: guarda estudios con
  # datos del paciente. Las credenciales salen del .env (ORTHANC_USUARIO,
  # ORTHANC_PASSWORD), que no se versiona; el valor por defecto es solo local.
  orthanc:
    image: orthancteam/orthanc:24.10.3
    container_name: cortex_orthanc
    environment:
      ORTHANC__NAME: "CORTEX"
      ORTHANC__DICOM_AET: "CORTEX"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USUARIO:-cortex}": "${ORTHANC_PASSWORD:-cambia-esta-clave-local}"}'
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      ORTHANC__DICOM_WEB__ENABLE_WADO: "true"
      ORTHANC__DICOM_WEB__WADO_ROOT: "/wado"
      VERBOSE_ENABLED: "false"
    ports:
      - "${ORTHANC_DICOM_PORT:-4242}:4242"
      - "${ORTHANC_HTTP_PORT:-8042}:8042"
    volumes:
      - cortex_orthanc_data:/var/lib/orthanc/db
    networks:
      - cortex_network
    profiles:
      - imagen

  # Whisper con API compatible con OpenAI (POST /v1/audio/transcriptions), en
  # CPU. El audio del dictado no sale del servidor.
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.2-cpu
    container_name: cortex_whisper
    environment:
      WHISPER__INFERENCE_DEVICE: "cpu"
    ports:
      - "${WHISPER_PORT:-8020}:8000"
    volumes:
      - cortex_whisper_models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - cortex_network
    profiles:
      - ia

  # Presidio: detecta datos personales para quitarlos antes de enviar texto a
  # un proveedor de IA externo.
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.358
    container_name: cortex_presidio_analyzer
    ports:
      - "${PRESIDIO_PORT:-5020}:3000"
    networks:
      - cortex_network
    profiles:
      - ia
  # ── fin base-modulos-extra ──

  # ── modelo-3d-desde-tc: segmentador de TC para Neuro 3D del paciente ──
  # Servicio aparte: torch y los pesos no viven en el proceso de la consulta.
  # Imagen con versión fija (cortex-segmentador:0.1.0, ver su Dockerfile). Solo
  # escucha en el equipo local: recibe estudios del paciente y no lleva
  # autenticación propia; el backend lo alcanza por la red interna.
  # SEGMENTADOR_FALSO=1 devuelve una columna sintética (sin GPU ni pesos).
  segmentador:
    build:
      context: ./servicios/segmentador
    image: cortex-segmentador:0.1.0
    container_name: cortex_segmentador
    environment:
      SEGMENTADOR_FALSO: ${SEGMENTADOR_FALSO:-0}
      SEGMENTADOR_RAPIDO: ${SEGMENTADOR_RAPIDO:-1}
      SEGMENTADOR_DISPOSITIVO: ${SEGMENTADOR_DISPOSITIVO:-cpu}
    ports:
      - "127.0.0.1:${SEGMENTADOR_PORT:-8030}:8000"
    volumes:
      - cortex_segmentador_pesos:/pesos
    networks:
      - cortex_network
    profiles:
      - ia
  # ── fin modelo-3d-desde-tc ──

volumes:
  cortex_postgres_data:
    name: cortex_postgres_data
  cortex_pgadmin_data:
    name: cortex_pgadmin_data
  # base-modulos-extra
  cortex_orthanc_data:
    name: cortex_orthanc_data
  cortex_whisper_models:
    name: cortex_whisper_models
  # modelo-3d-desde-tc
  cortex_segmentador_pesos:
    name: cortex_segmentador_pesos

networks:
  cortex_network:
    name: cortex_network
    driver: bridge
