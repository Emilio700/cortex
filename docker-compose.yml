services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cortex_postgres
    environment:
      POSTGRES_USER: cortex_user
      POSTGRES_PASSWORD: cortex_password
      POSTGRES_DB: cortex_db
    ports:
      - "5442:5432"
    volumes:
      - cortex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex_user -d cortex_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortex_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: cortex_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://cortex_user:cortex_password@postgres:5432/cortex_db
      SECRET_KEY: dev-secret-key-change-in-production-12345678901234567890
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:5173,http://localhost:3010
      FRONTEND_URL: http://localhost:3010
      ENVIRONMENT: development
      APP_NAME: CORTEX
      # SMTP credentials come from the untracked .env file — never hardcode the
      # Gmail App Password here, this file is committed. See .env.example.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@cortex.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CORTEX}
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cortex_network

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: cortex_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8010
    ports:
      - "3010:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - cortex_network

  # pgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cortex_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cortex.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-local-only}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5060:80"
    volumes:
      - cortex_pgadmin_data:/var/lib/pgadmin
    networks:
      - cortex_network
    profiles:
      - tools

volumes:
  cortex_postgres_data:
    name: cortex_postgres_data
  cortex_pgadmin_data:
    name: cortex_pgadmin_data

networks:
  cortex_network:
    name: cortex_network
    driver: bridge
