# =============================================================================
# G.E.M.S — Production Docker Compose
# Designed for IntegraNeitor (port-based exposure strategy).
# The frontend publishes port 8090 on the host → assign port 9447 in IntegraNeitor
# proxy routes. Backend and Postgres stay internal (Docker network only).
# =============================================================================

networks:
  cortex_network:
    name: cortex_network_prod
    driver: bridge

volumes:
  cortex_postgres_data_prod:
    name: cortex_postgres_data_prod
  cortex_uploads_prod:
    name: cortex_uploads_prod
  cortex_clamav_data_prod:
    name: cortex_clamav_data_prod

services:
  init-uploads:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    command: ["sh", "-c", "chown 1000:1000 /uploads && chmod 750 /uploads"]
    volumes:
      - cortex_uploads_prod:/uploads

  clamav:
    image: clamav/clamav:stable
    container_name: cortex_clamav_prod
    restart: unless-stopped
    volumes:
      - cortex_clamav_data_prod:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - cortex_network

  postgres:
    image: postgres:15-alpine
    container_name: cortex_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cortex_db}
    # Internal only — no host port published. Backend reaches it via cortex_network.
    volumes:
      - cortex_postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex_user} -d ${POSTGRES_DB:-cortex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cortex_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: cortex-backend:${IMAGE_TAG:-latest}
    container_name: cortex_backend_prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-cortex_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # Public URL of the frontend. Used to build the password-reset link sent
      # by email — if this is wrong the user gets an unusable localhost link.
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      ENVIRONMENT: production
      # Scheduled jobs run in the dedicated scheduler service below. Gunicorn
      # has four workers and must not start one scheduler per worker.
      SCHEDULER_ENABLED: "false"
      # Debe coincidir con los workers de Gunicorn (-w 4 en el Dockerfile). Solo
      # lo usa el freno de login para reportar el limite efectivo por IP (B-10):
      # 5 intentos/min por worker x 4 = hasta 20/min entre todos. No cambia a
      # Gunicorn (el -w del Dockerfile manda); si cambian los workers, cambialo.
      WEB_CONCURRENCY: "4"
      APP_NAME: G.E.M.S
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-}
      MFA_ISSUER: ${MFA_ISSUER:-G.E.M.S}
      MAX_TENANTS: ${MAX_TENANTS:-5}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ANTIVIRUS_ENABLED: ${ANTIVIRUS_ENABLED:-true}
      ANTIVIRUS_REQUIRED: ${ANTIVIRUS_REQUIRED:-true}
      CLAMAV_HOST: clamav
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@cortex.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-G.E.M.S}
    # Persist all clinical uploads in a named volume so they survive rebuilds
    # with ownership compatible with the non-root backend process.
    volumes:
      - cortex_uploads_prod:/app/uploads
    expose:
      - "8000"
    depends_on:
      init-uploads:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cortex_network

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: cortex-backend:${IMAGE_TAG:-latest}
    command: ["python", "scripts/migrate.py", "upgrade"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-cortex_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      ENVIRONMENT: production
      SCHEDULER_ENABLED: "false"
      ANTIVIRUS_ENABLED: ${ANTIVIRUS_ENABLED:-true}
      ANTIVIRUS_REQUIRED: ${ANTIVIRUS_REQUIRED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cortex_network

  scheduler:
    image: cortex-backend:${IMAGE_TAG:-latest}
    container_name: cortex_scheduler_prod
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler_runner"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-cortex_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      ENVIRONMENT: production
      SCHEDULER_ENABLED: "true"
      APP_NAME: G.E.M.S
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ANTIVIRUS_ENABLED: ${ANTIVIRUS_ENABLED:-true}
      ANTIVIRUS_REQUIRED: ${ANTIVIRUS_REQUIRED:-true}
      CLAMAV_HOST: clamav
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@cortex.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-G.E.M.S}
      # Espejo del sistema anterior (scripts/espejo_legacy.py). Si falta
      # cualquiera de estas, el job NO se registra y lo dice en la bitacora.
      # Solo las necesita el scheduler: el backend no corre trabajos.
      LEGACY_HOST: ${LEGACY_HOST:-}
      LEGACY_DB_GYG: ${LEGACY_DB_GYG:-}
      LEGACY_USER_GYG: ${LEGACY_USER_GYG:-}
      LEGACY_PASS_GYG: ${LEGACY_PASS_GYG:-}
      LEGACY_DB_SI: ${LEGACY_DB_SI:-}
      LEGACY_USER_SI: ${LEGACY_USER_SI:-}
      LEGACY_PASS_SI: ${LEGACY_PASS_SI:-}
      ESPEJO_LEGACY_TOPE_CITAS: ${ESPEJO_LEGACY_TOPE_CITAS:-500}
      ESPEJO_LEGACY_TOPE_RECETAS: ${ESPEJO_LEGACY_TOPE_RECETAS:-500}
    depends_on:
      init-uploads:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    networks:
      - cortex_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    image: cortex-frontend:${IMAGE_TAG:-latest}
    container_name: cortex_frontend_prod
    restart: unless-stopped
    ports:
      # Fixed host port so IntegraNeitor proxy can point at it reliably.
      # Map this port (e.g. 8090) to an external HTTPS port (e.g. 9447) in
      # IntegraNeitor → Proxy Routes.
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cortex_network
