<!DOCTYPE html>
<!-- G.E.M.S — Gynecology & Expert Management System -->
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- interactive-widget: con el teclado abierto en Android el contenido se encoge en vez de quedar debajo, y el pie de los formularios sigue a la vista (plan 29, lote 8). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, interactive-widget=resizes-content">
    <meta name="description" content="G.E.M.S — Gynecology &amp; Expert Management System">
    <meta name="author" content="GEMS">
    <meta name="keyword" content="GEMS,Medical,Healthcare,Clinic,Management">
    <title>GEMS</title>
    <link rel="manifest" href="/manifest.json">
    <!-- Íconos de la app instalable. El manifest apuntaba a una imagen que no
         existía (404) y Chrome no ofrecía "Instalar"; además pide 192 y 512 px. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <!-- El azul profundo del login y del arranque de la app instalada (plan 32,
         punto 1): abrir la app y llegar al acceso se ve como una sola pieza. -->
    <meta name="theme-color" content="#0b1640">
    <meta name="apple-mobile-web-app-title" content="GEMS">
    <meta name="application-name" content="GEMS">
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <!-- built files will be auto injected -->
  </body>
</html>
