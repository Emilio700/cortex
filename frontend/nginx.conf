server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;

    # IntegraNeitor/reverse proxies run on private Docker/host networks. Only
    # those trusted hops may supply X-Forwarded-For; direct public clients
    # cannot spoof the address used by the privacy-preserving audit hash.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Gzip static assets; route-level code splitting keeps the initial payload
    # bounded while compression reduces transfer size further.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively - Vite fingerprints filenames,
    # so a new deploy naturally busts this cache via new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El worker de pdf.js es un módulo .mjs y el navegador lo rechaza si no llega
    # como JavaScript (los workers de módulo exigen el MIME). Algunas versiones
    # de mime.types de nginx no conocen .mjs y lo mandan como octet-stream: sin
    # esto, la vista previa de los PDF no carga (plan 26, N5).
    location ~* ^/assets/.+\.mjs$ {
        default_type application/javascript;
        types { }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker se revisa en cada visita: si el navegador lo guardara,
    # un cambio en sw.js tardaria hasta un dia en llegar a los telefonos.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
